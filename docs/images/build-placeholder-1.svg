<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="560" fill="#0f172a"/>
  <rect x="20" y="20" width="760" height="520" rx="22" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- opened base seen from below -->
  <circle cx="400" cy="230" r="150" fill="#dc2626"/>
  <circle cx="400" cy="230" r="128" fill="#1e293b"/>
  <g fill="#94a3b8">
    <circle cx="400" cy="112" r="6"/><circle cx="502" cy="289" r="6"/><circle cx="298" cy="289" r="6"/>
  </g>
  <!-- stock LED board + controller -->
  <rect x="330" y="170" width="140" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <g fill="#fde68a"><circle cx="365" cy="205" r="12"/><circle cx="400" cy="205" r="12"/><circle cx="435" cy="205" r="12"/>
  <circle cx="365" cy="245" r="12"/><circle cx="400" cy="245" r="12"/><circle cx="435" cy="245" r="12"/></g>
  <path d="M400 280 V330" stroke="#020617" stroke-width="8" stroke-linecap="round"/>
  <!-- screwdriver -->
  <g transform="translate(560 120) rotate(35)">
    <rect x="-12" y="-70" width="24" height="70" rx="8" fill="#facc15"/>
    <rect x="-4" y="0" width="8" height="70" fill="#cbd5e1"/>
  </g>
  <text x="400" y="440" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle">Stock internals</text>
  <text x="400" y="474" font-size="18" fill="#94a3b8" text-anchor="middle">Build photo coming soon</text>
  <text x="400" y="504" font-size="14" fill="#64748b" text-anchor="middle">Replace docs/images/build-placeholder-1.svg</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#22c55e" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>

  <!-- board -->
  <rect x="60" y="50" width="780" height="400" rx="22" fill="url(#pcb)" stroke="#4ade80" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="60" y="50" width="780" height="400" rx="22" fill="url(#grid)"/>
  <g fill="#0f172a" stroke="#eab308" stroke-width="5">
    <circle cx="95" cy="85" r="11"/>
    <circle cx="805" cy="85" r="11"/>
    <circle cx="95" cy="415" r="11"/>
    <circle cx="805" cy="415" r="11"/>
  </g>

  <!-- traces -->
  <g fill="none" stroke="#eab308" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 200 H420 L460 160 H560"/>
    <path d="M330 240 H440 L480 280 H560"/>
    <path d="M330 280 H380 L420 340 H500"/>
    <path d="M100 320 H115 V395 H130"/>
    <path d="M210 365 V340"/>
    <path d="M290 405 H462 V364"/>
  </g>
  <g fill="#eab308">
    <circle cx="560" cy="160" r="7"/>
    <circle cx="560" cy="280" r="7"/>
    <circle cx="500" cy="340" r="7"/>
  </g>

  <!-- 24 V DC input from the IKEA adapter -->
  <rect x="30" y="300" width="70" height="40" rx="6" fill="#020617" stroke="#64748b" stroke-width="2"/>
  <circle cx="48" cy="320" r="9" fill="#334155"/>
  <circle cx="48" cy="320" r="3" fill="#cbd5e1"/>
  <text x="65" y="292" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">24 V IN</text>

  <!-- buck converter 24 V -> 5 V -->
  <rect x="130" y="365" width="160" height="62" rx="5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <rect x="142" y="375" width="40" height="40" rx="4" fill="#334155"/>
  <rect x="194" y="382" width="20" height="26" rx="2" fill="#0f172a"/>
  <text x="252" y="392" font-size="12" font-weight="700" fill="#e0f2fe" text-anchor="middle">CR-4030L</text>
  <text x="252" y="412" font-size="11" font-weight="700" fill="#e0f2fe" text-anchor="middle">24V→5V</text>

  <!-- ESP32-C3 Super Mini -->
  <rect x="140" y="140" width="190" height="200" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="180" y="190" width="110" height="90" rx="4" fill="#334155"/>
  <text x="235" y="230" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="middle">ESP32-C3</text>
  <text x="235" y="252" font-size="12" fill="#94a3b8" text-anchor="middle">Super Mini</text>
  <rect x="205" y="122" width="60" height="24" rx="6" fill="#94a3b8"/>
  <g fill="#eab308">
    <circle cx="160" cy="165" r="5"/><circle cx="160" cy="195" r="5"/><circle cx="160" cy="225" r="5"/>
    <circle cx="160" cy="255" r="5"/><circle cx="160" cy="285" r="5"/><circle cx="160" cy="315" r="5"/>
    <circle cx="310" cy="165" r="5"/><circle cx="310" cy="195" r="5"/><circle cx="310" cy="225" r="5"/>
    <circle cx="310" cy="255" r="5"/><circle cx="310" cy="285" r="5"/><circle cx="310" cy="315" r="5"/>
  </g>

  <!-- button -->
  <rect x="440" y="320" width="44" height="44" rx="6" fill="#cbd5e1"/>
  <circle cx="462" cy="342" r="12" fill="#475569"/>

  <!-- WS2812 ring (12 LEDs, 37 mm) -->
  <text x="680" y="372" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">WS2812 · 12 LEDs · Ø 37 mm</text>
  <circle cx="680" cy="230" r="105" fill="none" stroke="#0f172a" stroke-width="34"/>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <rect x="670" y="115" width="20" height="20" rx="3"/>
    <rect x="722.5" y="129.1" width="20" height="20" rx="3"/>
    <rect x="760.9" y="167.5" width="20" height="20" rx="3"/>
    <rect x="775" y="220" width="20" height="20" rx="3"/>
    <rect x="760.9" y="272.5" width="20" height="20" rx="3"/>
    <rect x="722.5" y="310.9" width="20" height="20" rx="3"/>
    <rect x="670" y="325" width="20" height="20" rx="3"/>
    <rect x="617.5" y="310.9" width="20" height="20" rx="3"/>
    <rect x="579.1" y="272.5" width="20" height="20" rx="3"/>
    <rect x="565" y="220" width="20" height="20" rx="3"/>
    <rect x="579.1" y="167.5" width="20" height="20" rx="3"/>
    <rect x="617.5" y="129.1" width="20" height="20" rx="3"/>
  </g>

  <!-- placeholder label -->
  <rect x="210" y="478" width="480" height="58" rx="29" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="6 6" stroke-width="2"/>
  <text x="450" y="503" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">CIRCUIT BOARD PHOTO – COMING SOON</text>
  <text x="450" y="524" font-size="13" fill="#94a3b8" text-anchor="middle">AFTONSPARV mod · replace docs/images/pcb-placeholder.svg with a photo</text>
</svg>

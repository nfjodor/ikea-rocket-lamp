<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#818cf8"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="#0f172a"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <rect x="24" y="24" width="552" height="752" rx="24" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- AFTONSPARV-style rocket: white body, red nose, fins and base -->
  <g transform="translate(300 320)">
    <path d="M-52,20 L-105,135 L-50,118 Z" fill="#dc2626"/>
    <path d="M52,20 L105,135 L50,118 Z" fill="#b91c1c"/>
    <path d="M0,-210 C72,-140 82,-20 68,118 L-68,118 C-82,-20 -72,-140 0,-210 Z" fill="#1e293b"/>
    <path d="M0,-210 C72,-140 82,-20 68,118 L-68,118 C-82,-20 -72,-140 0,-210 Z" fill="url(#body)" opacity="0.9"/>
    <path d="M0,-210 C28,-183 44,-156 54,-128 L-54,-128 C-44,-156 -28,-183 0,-210 Z" fill="#dc2626"/>
    <circle cy="-75" r="24" fill="url(#light)" stroke="#cbd5e1" stroke-width="6"/>
    <circle cy="-10" r="24" fill="url(#light)" stroke="#cbd5e1" stroke-width="6"/>
    <circle cy="55" r="24" fill="url(#light)" stroke="#cbd5e1" stroke-width="6"/>
    <rect x="-95" y="118" width="190" height="38" rx="12" fill="#dc2626"/>
  </g>

  <!-- camera icon -->
  <g transform="translate(300 586)" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linejoin="round">
    <path d="M-42,-22 H-18 L-10,-34 H10 L18,-22 H42 V30 H-42 Z"/>
    <circle cy="4" r="15"/>
  </g>

  <text x="300" y="668" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle">Rainbow mode</text>
  <text x="300" y="704" font-size="18" fill="#94a3b8" text-anchor="middle">Modded AFTONSPARV · photo coming soon</text>
  <text x="300" y="736" font-size="14" fill="#64748b" text-anchor="middle">Replace docs/images/photo-placeholder-1.svg</text>
</svg>

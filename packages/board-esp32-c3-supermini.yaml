# Rocket Lamp – ESP32-C3 Super Mini board.
#
# Chip/framework setup, Wi-Fi tuning and default pin wiring. Pair it with
# packages/lamp.yaml. For another board, copy this file and change it.
#
# In the AFTONSPARV mod the board runs from IKEA's 3 W / 24 V adapter through a
# CR-4030L 6-32 V -> 5 V buck converter, so the power budget is tight (see
# README.md).

substitutions:
  led_pin: GPIO3      # WS2812 data in
  button_pin: GPIO0   # push button to GND (internal pull-up is used)

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    # ESP-IDF 5.x uses the new RMT driver, so no rmt_channel is needed.
    type: esp-idf

wifi:
  # ESP32-C3 Super Mini boards have a poorly matched antenna; full TX power
  # makes the link drop/stall. Lower power + no power save keeps HA responsive.
  # The lower TX power also leaves more of the adapter's 3 W for the LEDs.
  output_power: 8.5dB
  power_save_mode: none
